[package]
name = "nextc"
authors = ["Glacyend <Glacyend@outlook.com>"]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "A system programming language inspired by C, offering modern syntax, stronger type safety, zero-cost abstractions, and full low-level control."
keywords = [
    "nextc",
    "c",
    "system",
    "programming",
    "language",
    "modern",
    "safety",
    "low-level",
]
build = "build.rs"

[dependencies]
current_platform = "0.2.0"
indoc = "2.0.8"

[build-dependencies]
build-data = "0.3.3"
